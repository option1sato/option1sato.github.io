<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docwize × Oliver 不動産デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#185FA5;
  --brand-700:#0F4279;
  --brand-300:#5B97D1;
  --navy:#0B1E33;
  --navy-2:#102A43;
  --oliver:#E0972E;       /* AIアクセント（温かみ） */
  --oliver-soft:#FBEFD8;
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --ink:#16222F;
  --ink-2:#52647A;
  --line:#E2E8F0;
  --ok:#1F9D6B;
  --no:#C9485B;
  --shadow:0 18px 50px -20px rgba(11,30,51,.35);
  --shadow-sm:0 6px 20px -10px rgba(11,30,51,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans JP",sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(24,95,165,.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(224,151,46,.12), transparent 60%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;flex-direction:column;
}
.font-out{font-family:"Outfit",sans-serif}
.mono{font-family:"IBM Plex Mono",monospace}

/* ---------- Top bar ---------- */
header{
  display:flex;align-items:center;gap:18px;
  padding:14px 28px;
  background:linear-gradient(120deg,var(--navy),var(--navy-2));
  color:#fff;position:sticky;top:0;z-index:30;
  box-shadow:0 4px 30px -10px rgba(0,0,0,.5);
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand-300),var(--brand));
  display:grid;place-items:center;font-family:"Outfit";font-weight:800;font-size:19px;
  box-shadow:0 4px 14px -4px rgba(24,95,165,.8);
}
.brand h1{font-family:"Outfit";font-weight:700;font-size:19px;letter-spacing:.3px}
.brand .tag{font-size:11px;color:#9DB4CC;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.oliver-pill{
  margin-left:4px;display:flex;align-items:center;gap:7px;
  background:rgba(224,151,46,.15);border:1px solid rgba(224,151,46,.4);
  padding:5px 11px;border-radius:999px;font-size:12px;color:#F4C57A;font-weight:500;
}
.oliver-dot{width:8px;height:8px;border-radius:50%;background:var(--oliver);box-shadow:0 0 0 4px rgba(224,151,46,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.scene-tabs{margin-left:auto;display:flex;gap:8px;background:rgba(255,255,255,.07);padding:5px;border-radius:12px}
.scene-tabs button{
  border:0;background:transparent;color:#B9C8DA;cursor:pointer;
  font-family:"Noto Sans JP";font-weight:700;font-size:13px;
  padding:9px 16px;border-radius:8px;transition:.25s;white-space:nowrap;
}
.scene-tabs button.active{background:#fff;color:var(--navy)}

/* ---------- Layout ---------- */
.demo-note{
  text-align:center;font-size:11.5px;color:var(--ink-2);
  padding:7px;background:repeating-linear-gradient(45deg,#fff7e6,#fff7e6 12px,#fdf1d6 12px,#fdf1d6 24px);
  border-bottom:1px solid #f0e2bf;letter-spacing:.04em;
}
main{flex:1;display:grid;grid-template-columns:1fr 420px;gap:30px;padding:30px 34px;max-width:1320px;margin:0 auto;width:100%}
@media(max-width:1040px){main{grid-template-columns:1fr}}

/* stage */
.stage{display:flex;align-items:flex-start;justify-content:center;min-height:600px}

/* phone */
.phone{
  width:340px;height:712px;border-radius:46px;background:#0a0f16;
  padding:13px;box-shadow:var(--shadow),0 0 0 2px #222 inset;position:relative;flex:none;
}
.phone .notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:128px;height:26px;background:#0a0f16;border-radius:0 0 16px 16px;z-index:6}
.screen{width:100%;height:100%;border-radius:34px;background:#EAF0F6;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 26px;font-size:12.5px;font-weight:700;color:var(--ink);flex:none}
.statusbar .r{display:flex;gap:6px;align-items:center;font-size:11px}

/* app header inside phone */
.app-top{display:flex;align-items:center;gap:9px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.app-top .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--oliver),#d07f1c);display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Outfit";font-size:14px}
.app-top .nm{font-weight:700;font-size:13.5px}
.app-top .sub{font-size:10.5px;color:var(--ink-2)}

.scr-body{flex:1;overflow-y:auto;padding:16px}
.scr-body::-webkit-scrollbar{width:0}

/* desktop frame */
.desktop{
  width:100%;max-width:760px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);
}
.dt-bar{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#F1F5FA;border-bottom:1px solid var(--line)}
.dt-bar .dots{display:flex;gap:6px}
.dt-bar .dots i{width:11px;height:11px;border-radius:50%;display:block}
.dt-url{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:11.5px;color:var(--ink-2);font-family:"IBM Plex Mono"}
.dt-body{padding:0;min-height:540px;display:flex}
.dt-side{width:172px;background:var(--navy);color:#cdd9e6;padding:18px 14px;flex:none}
.dt-side .si{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:8px;font-size:12.5px;margin-bottom:3px}
.dt-side .si.on{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.dt-side .si span.ic{width:18px;text-align:center}
.dt-main{flex:1;padding:22px 24px;overflow-y:auto;max-height:540px}

/* side panel (narration) */
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-sm);border:1px solid var(--line);overflow:hidden;align-self:start;position:sticky;top:104px}
.panel .ph{padding:16px 20px;background:linear-gradient(120deg,var(--brand),var(--brand-700));color:#fff}
.panel .ph .step{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-family:"Outfit";font-weight:600}
.panel .ph h2{font-size:17px;margin-top:5px;font-weight:700;line-height:1.4}
.panel .pb{padding:18px 20px}
.panel .pb p{font-size:13.5px;line-height:1.85;color:var(--ink-2)}
.panel .pb p b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 4px}
.flow .fx{font-size:10.5px;padding:4px 9px;border-radius:6px;background:#F1F5FA;color:var(--ink-2);font-weight:500}
.flow .fx.cur{background:var(--brand);color:#fff;font-weight:700}
.qbox{margin-top:16px;background:var(--oliver-soft);border:1px solid #efd9a8;border-radius:12px;padding:13px 15px}
.qbox .qt{font-size:11px;font-weight:700;color:#9a6a14;letter-spacing:.08em;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.qbox ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.qbox li{font-size:12px;color:#6b4e12;line-height:1.6;padding-left:15px;position:relative}
.qbox li::before{content:"?";position:absolute;left:0;top:0;color:var(--oliver);font-weight:800}

/* controls */
.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dots-nav{display:flex;gap:8px}
.dots-nav i{width:9px;height:9px;border-radius:50%;background:#cdd6e2;cursor:pointer;transition:.2s}
.dots-nav i.on{background:var(--brand);transform:scale(1.25)}
.btn{border:0;cursor:pointer;font-family:"Noto Sans JP";font-weight:700;font-size:13.5px;padding:11px 22px;border-radius:11px;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn-prev{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-prev:hover{border-color:var(--brand-300);color:var(--brand)}
.btn-next{background:linear-gradient(135deg,var(--brand),var(--brand-700));color:#fff;box-shadow:0 8px 20px -8px rgba(24,95,165,.7)}
.btn-next:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.step-label{font-size:12.5px;color:var(--ink-2);font-weight:700;min-width:96px;text-align:center}

/* ====== reusable bubbles / cards ====== */
.day{text-align:center;margin:8px 0 14px}
.day span{background:rgba(0,0,0,.08);color:#5a6a7c;font-size:10.5px;padding:3px 11px;border-radius:999px}
.bubble{max-width:78%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.6;margin-bottom:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bubble.in{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.bubble.out{background:#7ED957;border-top-right-radius:4px;align-self:flex-end;color:#0c2b00}
.bubble.sys{background:var(--oliver-soft);border:1px solid #efd9a8;color:#6b4e12;align-self:center;max-width:90%;font-size:12px;text-align:center}
.bmeta{font-size:9.5px;color:#90a0b0;margin:0 4px 12px}
.chatcol{display:flex;flex-direction:column}

.fab-sender{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.fab-sender .ava{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Outfit"}

/* Oliver notification card (lockscreen pop) */
.lock{position:absolute;inset:0;background:linear-gradient(160deg,#1b3a5c,#0b1e33);display:flex;flex-direction:column;align-items:center;padding-top:90px;color:#fff}
.lock .clock{font-family:"Outfit";font-size:64px;font-weight:300;letter-spacing:1px}
.lock .date{font-size:13px;color:#aebfd0;margin-bottom:46px}
.notif{
  width:88%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);
  border-radius:18px;padding:14px;backdrop-filter:blur(12px);cursor:pointer;
  animation:drop .5s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:translateY(0)}}
.notif .nh{display:flex;align-items:center;gap:8px;font-size:11px;color:#d7e2ee;margin-bottom:8px}
.notif .nh .ic{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--oliver),#d07f1c);display:grid;place-items:center;font-size:11px;font-weight:800;font-family:"Outfit"}
.notif .nt{font-weight:700;font-size:14px;margin-bottom:4px}
.notif .nb{font-size:12.5px;color:#cdd9e6;line-height:1.5}
.notif .hint{margin-top:10px;font-size:10.5px;color:#88a;text-align:center;letter-spacing:.08em}
.tap-cue{margin-top:8px;font-size:11px;color:#7fd0ff;text-align:center;animation:pulse 1.6s infinite}

/* candidate card */
.olv-msg{background:var(--oliver-soft);border:1px solid #efd9a8;border-radius:14px;padding:12px 13px;margin-bottom:14px;font-size:12.5px;color:#6b4e12;line-height:1.6}
.olv-msg b{color:#5a3f0c}
.cand{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;transition:.2s}
.cand.approved{border-color:var(--ok);box-shadow:0 0 0 2px rgba(31,157,107,.15)}
.cand.rejected{opacity:.5}
.cand .top{display:flex;align-items:center;gap:9px}
.cand .ava{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.cand .nm{font-weight:700;font-size:13.5px}
.cand .role{font-size:10.5px;color:var(--ink-2)}
.match{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.match.hi{background:#e3f6ed;color:var(--ok)}
.match.mid{background:#fdeedd;color:#b9791c}
.cand .why{font-size:11px;color:var(--ink-2);line-height:1.55;margin:9px 0 11px;background:#f6f9fc;padding:7px 9px;border-radius:8px}
.cand .acts{display:flex;gap:8px}
.cand .acts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-family:"Noto Sans JP";font-weight:700;font-size:12px;cursor:pointer;transition:.15s}
.cand .acts .ap.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.cand .acts .rj.sel{background:var(--no);color:#fff;border-color:var(--no)}
.cand .acts button:hover{transform:translateY(-1px)}

.send-status{background:#fff;border:1px dashed var(--brand-300);border-radius:12px;padding:13px;text-align:center;font-size:12.5px;color:var(--brand-700);margin-bottom:12px}
.sent-row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;animation:slidein .4s both}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sent-row .ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.sent-row .chk{margin-left:auto;color:var(--ok);font-weight:800;font-size:16px}

.reminder{background:var(--navy);color:#fff;border-radius:13px;padding:14px;margin-top:14px}
.reminder .rt{font-size:11px;letter-spacing:.1em;color:var(--oliver);font-weight:700;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.reminder .ri{font-size:12.5px;line-height:1.6;color:#cdd9e6}

/* ===== desktop / scene2 content ===== */
.dt-h{font-family:"Outfit";font-weight:700;font-size:20px;margin-bottom:4px;color:var(--ink)}
.dt-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:20px}
.src-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.src{background:#f6f9fc;border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center}
.src .n{font-family:"Outfit";font-weight:800;font-size:22px;color:var(--brand)}
.src .l{font-size:11px;color:var(--ink-2);margin-top:2px}
.gen-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--oliver);font-weight:700;margin:16px 0 6px}
.gen-line .spin{width:14px;height:14px;border:2px solid #f0d9ab;border-top-color:var(--oliver);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.doc-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.doc-card .dc-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafcfe}
.doc-card .dc-h .tg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand);color:#fff}
.doc-card .dc-h .ti{font-weight:700;font-size:13px}
.doc-card .dc-h .auto{margin-left:auto;font-size:10.5px;color:var(--oliver);font-weight:700;display:flex;gap:4px;align-items:center}
.doc-card .dc-b{padding:14px}
.docline{font-size:12px;line-height:1.5;padding:7px 0;border-bottom:1px dashed #eef2f6;display:flex;gap:10px}
.docline:last-child{border:0}
.docline .k{color:var(--ink-2);width:118px;flex:none}
.docline .v{color:var(--ink);font-weight:500}
.docline .auto-tag{font-size:9px;background:#eaf2fb;color:var(--brand);padding:1px 6px;border-radius:5px;align-self:center;margin-left:auto;font-weight:700}

.issue{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--oliver);border-radius:9px;margin-bottom:9px;background:#fff}
.issue .ico{color:var(--oliver);font-weight:800;font-size:15px}
.issue .it{font-weight:700;font-size:12.5px;margin-bottom:3px}
.issue .id{font-size:11.5px;color:var(--ink-2);line-height:1.55}

.risk{display:flex;gap:10px;padding:11px 13px;border:1px solid #f3d4d9;border-left:3px solid var(--no);border-radius:9px;margin-bottom:9px;background:#fef8f9}
.risk .ico{color:var(--no);font-weight:800;font-size:15px}
.risk .it{font-weight:700;font-size:12.5px;margin-bottom:3px;color:#8f2233}
.risk .id{font-size:11.5px;color:#7a4650;line-height:1.55}
.risk .ref{font-size:10px;color:#b06; margin-top:5px;font-family:"IBM Plex Mono"}

.wf{display:flex;flex-direction:column;gap:0}
.wf-step{display:flex;gap:13px;position:relative;padding-bottom:18px}
.wf-step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:var(--line)}
.wf-step .dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;z-index:1}
.wf-step .dot.done{background:var(--ok);color:#fff}
.wf-step .dot.now{background:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(24,95,165,.18)}
.wf-step .dot.wait{background:#e4ebf2;color:#9aa9b8}
.wf-step .wc .wt{font-weight:700;font-size:13px}
.wf-step .wc .ws{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:2px}
.wf-step .wc .evid{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.wf-step .wc .evid span{font-size:9.5px;background:#eef4fa;color:var(--brand-700);padding:3px 7px;border-radius:5px;font-weight:600}

.done-banner{text-align:center;padding:30px 16px}
.done-banner .seal{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--ok),#0f7a4f);display:grid;place-items:center;margin:0 auto 16px;color:#fff;font-size:38px;box-shadow:0 12px 30px -10px rgba(31,157,107,.6)}
.done-banner h3{font-family:"Outfit";font-size:21px;margin-bottom:8px}
.done-banner p{font-size:13px;color:var(--ink-2);line-height:1.7;max-width:440px;margin:0 auto}
.kpi{display:flex;gap:12px;justify-content:center;margin-top:22px}
.kpi .k{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-width:120px}
.kpi .k .v{font-family:"Outfit";font-weight:800;font-size:22px;color:var(--brand)}
.kpi .k .v small{font-size:13px}
.kpi .k .l{font-size:10.5px;color:var(--ink-2);margin-top:3px}

.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo font-out">D</div>
    <div>
      <h1 class="font-out">Docwize</h1>
      <div class="tag">Real Estate</div>
    </div>
  </div>
  <div class="oliver-pill"><span class="oliver-dot"></span>AI Assistant&nbsp;<b style="font-family:Outfit">Oliver</b></div>
  <div class="scene-tabs">
    <button id="tab1" class="active" onclick="setScene('s1')">シチュエーション 1<br><span style="font-weight:400;font-size:10px;opacity:.8">営業チャンスのタイムリーサポート</span></button>
    <button id="tab2" onclick="setScene('s2')">シチュエーション 2<br><span style="font-weight:400;font-size:10px;opacity:.8">契約書作成時のサポート</span></button>
  </div>
</header>

<div class="demo-note">これはコンセプト検証用のデモ（モック）です ／ 実データではありません ／ 画面はイメージです</div>

<main>
  <div class="stage" id="stage"></div>

  <aside class="panel">
    <div class="ph">
      <div class="step font-out" id="pStep">STEP 1 / 6</div>
      <h2 id="pTitle">タイトル</h2>
    </div>
    <div class="pb">
      <p id="pBody">説明</p>
      <div class="flow" id="pFlow"></div>
      <div class="qbox">
        <div class="qt">レビュー協力者へのヒアリング</div>
        <ul id="pQ"></ul>
      </div>
    </div>
  </aside>
</main>

<div class="controls">
  <button class="btn btn-prev" id="btnPrev" onclick="go(-1)">◀ 戻る</button>
  <div class="dots-nav" id="dotsNav"></div>
  <span class="step-label" id="stepLabel"></span>
  <button class="btn btn-next" id="btnNext" onclick="go(1)">次へ ▶</button>
</div>

<script>
/* ================= DATA ================= */
const candidates = [
  {id:'c1', nm:'佐藤 健一 様', role:'個人 / 自己居住', color:'#185FA5', match:'hi',

/* ================= STATE ================= */
let scene='s1', idx=0;
const approvals={}; // candidate -> 'ap'/'rj'
let notifTapped=false;

/* ================= RENDER ================= */
function setScene(s){
  scene=s; idx=0; notifTapped=false;
  document.getElementById('tab1').classList.toggle('active',s==='s1');
  document.getElementById('tab2').classList.toggle('active',s==='s2');
  render();
}
function go(d){
  // gate: scene1 step2 requires tapping notification
  const max=(scene==='s1'?scene1:scene2).length-1;
  if(scene==='s1' && idx===1 && d>0 && !notifTapped){ return; }
  idx=Math.max(0,Math.min(max,idx+d));
  render();
}

function render(){
  const data = scene==='s1'?scene1:scene2;
  const flow = scene==='s1'?flow1:flow2;
  const s=data[idx];
  // panel
  document.getElementById('pStep').textContent=`STEP ${idx+1} / ${data.length}`;
  document.getElementById('pTitle').textContent=s.title;
  document.getElementById('pBody').innerHTML=s.body;
  document.getElementById('pFlow').innerHTML=flow.map((f,i)=>`<span class="fx ${i===idx?'cur':''}">${f}</span>`).join('');
  document.getElementById('pQ').innerHTML=s.q.map(q=>`<li>${q}</li>`).join('');
  // dots
  document.getElementById('dotsNav').innerHTML=data.map((_,i)=>`<i class="${i===idx?'on':''}" onclick="idx=${i};render()"></i>`).join('');
  document.getElementById('stepLabel').textContent=`${idx+1} / ${data.length}`;
  document.getElementById('btnPrev').disabled=(idx===0);
  document.getElementById('btnNext').disabled=(idx===data.length-1) || (scene==='s1'&&idx===1&&!notifTapped);
  document.getElementById('btnNext').textContent = (idx===data.length-1)?'完了 ✓':'次へ ▶';
  // stage
  document.getElementById('stage').innerHTML = scene==='s1'?renderPhone():renderDesktop();
}

          <div class="docline"><span class="k">ローン特約</span><span class="v">契約日から45日以内</span><span class="auto-tag" style="background:#e3f6ed;color:var(--ok)">解消</span></div>
          <div class="docline"><span class="k">契約不適合責任</span><span class="v">引渡後3ヶ月（雨漏り・シロアリ・給排水）</span><span class="auto-tag" style="background:#e3f6ed;color:var(--ok)">解消</span></div>
          <div class="docline"><span class="k">手付金</span><span class="v">324万円（代金の5%）</span><span class="auto-tag" style="background:#e3f6ed;color:var(--ok)">解消</span></div>
          <div class="docline"><span class="k">越境物</span><span class="v">隣地ブロック塀につき覚書を別途締結</span><span class="auto-tag" style="background:#fdeedd;color:#b9791c">留意反映</span></div>
          <div class="docline"><span class="k">ハザード</span><span class="v">浸水想定区域（最大0.5〜3m）を明記</span><span class="auto-tag" style="background:#fdeedd;color:#b9791c">留意反映</span></div>
        </div>
      </div>`);
  }
  if(idx===4){
    return deskShell(4,`
      <div class="dt-h">社内ワークフローでレビュー</div>
      <div class="dt-sub">Docwize経由でレビュー依頼を起票。レビュワーは記載の根拠素材とセットで確認できます。</div>
      <div class="wf">
        <div class="wf-step"><div class="dot done">1</div><div class="wc"><div class="wt">田中（担当）が書類を提出</div><div class="ws">契約書・重説ドラフトをレビュー依頼として起票。</div></div></div>
        <div class="wf-step"><div class="dot now">2</div><div class="wc"><div class="wt">宅建士・上長がレビュー中</div><div class="ws">各条項について、根拠となる履歴・公的データを参照しながら正当性を確認。</div>
          <div class="evid"><span>📧 売主合意メール</span><span>💬 高橋様 LINE履歴</span><span>📐 確定測量図</span><span>🌊 ハザードデータ</span></div></div></div>
        <div class="wf-step"><div class="dot wait">3</div><div class="wc"><div class="wt">承認・差戻し</div><div class="ws">指摘があれば該当箇所にコメントを付けて差戻し。修正もOliverが補助。</div></div></div>
      </div>
      <div class="olv-msg" style="margin-top:14px">💡 <b>ポイント：</b>レビュワーは「なぜこの条件になったのか」を、元の履歴に遡って即座に確認できます。属人的な口頭引き継ぎが不要になります。</div>`);
  }
  if(idx===5){
    return deskShell(5,`
      <div class="done-banner">
        <div class="seal">✓</div>
        <h3 class="font-out">契約書・重要事項説明書が完成</h3>
        <p>2年間の履歴に基づく原案作成から、論点整理・トラブル回避・社内レビューまで。<b>根拠が紐づいた状態</b>で書類が確定しました。</p>
        <div class="kpi">
          <div class="k"><div class="v">3〜5h<small> →</small> 30m</div><div class="l">重説作成にかかる時間</div></div>
          <div class="k"><div class="v">100<small>%</small></div><div class="l">根拠の追跡可能性</div></div>
          <div class="k"><div class="v">脱<small></small></div><div class="l">属人化・抜け漏れ</div></div>
        </div>
      </div>`);
  }
}

render();
</script>
